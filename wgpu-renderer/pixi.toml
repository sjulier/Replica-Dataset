[workspace]
name = "replica-wgpu"
description = "Native Replica renderer on WebGPU (spike)"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
python = "3.12.*"
numpy = ">=2"
pillow = ">=11"
pytest = ">=9.2.0,<10"

[pypi-dependencies]
# Prebuilt wheels (with wgpu-native) for every platform above: nothing to compile.
wgpu = ">=0.33,<0.34"

[tasks]
render = "python render_sequence.py"
